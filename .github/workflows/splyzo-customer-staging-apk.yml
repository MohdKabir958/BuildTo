name: Splyzo Customer Staging Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/splyzo-customer-staging-apk.yml'
      - 'apps/customer_app/**'
      - 'packages/**'
      - 'branding/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-staging-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ORG_GRADLE_PROJECT_disableFirebase: 'true'
      GROZO_AUTH_MODE: clerk-test
      CI: 'true'
      STAGING_CLERK_PUBLISHABLE_KEY: ${{ vars.SPLYZO_CUSTOMER_CLERK_PUBLISHABLE_KEY || vars.SPLYZO_SUPPLIER_CLERK_PUBLISHABLE_KEY || 'pk_test_aW5mb3JtZWQtZ3JpZmZvbi03Njc1LmNsZXJrLmFjY291bnRzLmRldiQ=' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Resolve customer dependencies
        working-directory: apps/customer_app
        run: flutter pub get --enforce-lockfile
      - name: Analyze V2.1 customer and run V2.1 tests
        working-directory: apps/customer_app
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/v21 test/v21
          flutter test --no-pub test/v21
      - name: Build customer V2.1 staging APK for ARM64
        working-directory: apps/customer_app
        run: |
          set -euo pipefail
          if [[ "$STAGING_CLERK_PUBLISHABLE_KEY" != pk_test_* ]]; then
            echo 'A valid Clerk test publishable key is required.'
            exit 1
          fi
          export CLERK_PUBLISHABLE_KEY="$STAGING_CLERK_PUBLISHABLE_KEY"
          flutter build apk --debug --no-pub --split-per-abi --target-platform android-arm64 \
            --dart-define=BUILDTO_CUSTOMER_V21=true \
            --dart-define=AUTH_MODE=clerk-test \
            --dart-define=BUILDTO_V21_API_BASE_URL=https://buildto-v21-staging.onrender.com
          mkdir -p ../../build/splyzo-customer-staging
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
            ../../build/splyzo-customer-staging/Splyzo-Customer-Staging-ARM64.apk
      - name: Checksums and install notes
        run: |
          set -euo pipefail
          cd build/splyzo-customer-staging
          sha256sum *.apk > SHA256SUMS.txt
          cat > README-INSTALL.txt <<EOF
          Splyzo Customer V2.1 staging Android APK
          Source commit: ${GITHUB_SHA}
          Package: in.buildto.customer
          Debug-signed ARM64 build; test only, not production.
          Native Clerk sign-in and V2.1 customer marketplace.
          Backend: https://buildto-v21-staging.onrender.com
          External services (Clerk and Render) must be live and use matching configuration.
          Do not use real customer payment or private account data for testing.
          Install on a 64-bit Android phone after extracting this ZIP.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Splyzo-Customer-Staging-ARM64
          path: build/splyzo-customer-staging/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
