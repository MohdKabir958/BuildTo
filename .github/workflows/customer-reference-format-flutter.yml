name: Customer reference Flutter formatter temporary
on:
  push:
    branches: [feat/customer-reference-ui-navy-orange-20261123]
    paths: ['.github/workflows/customer-reference-format-flutter.yml']
permissions:
  contents: read
jobs:
  format-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Canonical Flutter 3.44.9 format export
        working-directory: apps/customer_app
        run: |
          set -euo pipefail
          dart format lib/v21 test/v21
          dart format --output=none --set-exit-if-changed lib/v21 test/v21
          for file in lib/v21/customer_reference_home.dart lib/v21/customer_reference_auth.dart; do
            echo "SPLYZO_REF_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "SPLYZO_REF_FORMAT_END:$file"
          done
      - name: Install packages
        working-directory: apps/customer_app
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test formatted customer reference
        working-directory: apps/customer_app
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/v21 test/v21
          flutter test --no-pub test/v21/customer_reference_ui_test.dart
