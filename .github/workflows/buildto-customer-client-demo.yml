name: BuildTo Customer Client UI Preview APK
on:
  push:
    branches:
      - buildto/customer-client-ui-demo-20261108
    paths:
      - '.github/workflows/buildto-customer-client-demo.yml'
      - 'apps/customer_app/**'
      - 'packages/kraveo_ui/**'
      - 'branding/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-customer-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      ORG_GRADLE_PROJECT_disableFirebase: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: apps/customer_app
        run: flutter pub get --enforce-lockfile
      - name: Analyze customer app
        working-directory: apps/customer_app
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run customer shopping and checkout tests
        working-directory: apps/customer_app
        run: |
          flutter test --no-pub --concurrency=2 \
            test/customer_app_test.dart \
            test/catalog_test.dart \
            test/grocery_products_test.dart \
            test/cart_moq_pricing_test.dart \
            test/checkout_order_test.dart \
            test/order_management_test.dart \
            test/ui_screens_test.dart
      - name: Build standalone offline customer preview (ARM64)
        working-directory: apps/customer_app
        run: |
          flutter build apk --debug --split-per-abi --target-platform android-arm64 --no-pub \
            --dart-define=BUILDTO_OFFLINE_DEMO=true
      - name: Prepare APK and install notes
        run: |
          mkdir -p build/customer-client-preview
          cp apps/customer_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
            build/customer-client-preview/BuildTo-Customer-Client-UI-Preview-ARM64.apk
          cd build/customer-client-preview
          sha256sum *.apk > SHA256SUMS.txt
          cat > README-INSTALL.txt <<'EOF'
          BUILDTO CUSTOMER - CLIENT UI PREVIEW - ANDROID ARM64
          Install the APK on a 64-bit Android phone.
          App opens directly into the customer shopping home; no login or backend required.
          Includes sample product photos bundled in the app, 9 construction categories,
          supplier listings, product details, wishlist, cart, MOQ validation, checkout,
          sample orders, order history/tracking, notifications and profile.
          All catalogue/order information in this preview is illustrative sample data.
          Payment, live supplier inventory, delivery GPS, SMS and backend transactions are
          not live. This is a development-signed preview, not a production/Play Store build.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: BuildTo-Customer-Client-UI-Preview-ARM64
          path: build/customer-client-preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
