name: One-time S06 Dart formatting
on:
  push:
    branches:
      - supplier/v21-s06-warehouse-inventory
    paths:
      - '.github/workflows/buildto-v21-format-s06.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - name: Format S06 changes and commit to own branch
        run: |
          dart format apps/vendor_app/lib/v21/inventory apps/vendor_app/test/v21/supplier_inventory_repository_test.dart apps/vendor_app/lib/v21/auth/supplier_auth_controller.dart apps/vendor_app/lib/v21/auth/supplier_auth_gate.dart apps/vendor_app/lib/v21/screens/supplier_shell.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/vendor_app/lib/v21/inventory apps/vendor_app/test/v21/supplier_inventory_repository_test.dart apps/vendor_app/lib/v21/auth/supplier_auth_controller.dart apps/vendor_app/lib/v21/auth/supplier_auth_gate.dart apps/vendor_app/lib/v21/screens/supplier_shell.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(s06): apply official Dart formatter"
            git push origin HEAD:supplier/v21-s06-warehouse-inventory
          fi
