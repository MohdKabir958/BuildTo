name: BuildTo Supplier S14 release hardening
on:
  pull_request:
    paths:
      - 'apps/vendor_app/lib/v21/**'
      - 'apps/vendor_app/test/v21/**'
      - 'apps/vendor_app/docs/v21/S14-RELEASE-HARDENING.md'
      - '.github/workflows/buildto-v21-supplier-s14.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-policy-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Resolve locked Flutter deps
        working-directory: apps/vendor_app
        run: flutter pub get --enforce-lockfile
      - name: Validate official formatting
        working-directory: apps/vendor_app
        run: dart format --output=none --set-exit-if-changed lib/v21 test/v21
      - name: Analyze all supplier code and tests
        working-directory: apps/vendor_app
        run: flutter analyze --no-pub lib/v21 test/v21
      - name: Exercise host pinning, production auth and all supplier regressions
        working-directory: apps/vendor_app
        run: flutter test --no-pub --concurrency=2 test/v21
      - name: Debug-only staged bundle; no release credentials from CI
        working-directory: apps/vendor_app
        run: |
          flutter build bundle --debug --no-pub \
            --dart-define=BUILDTO_SUPPLIER_V21=true \
            --dart-define=AUTH_MODE=clerk-test \
            --dart-define=BUILDTO_V21_API_BASE_URL=https://buildto-v21-staging.onrender.com
