name: Supplier Dart format capture temporary
on:
  push:
    branches: [fix/supplier-product-form-resume-ux]
    paths: ['.github/workflows/supplier-dart-format-capture.yml']
permissions:
  contents: read
jobs:
  format-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Format supplier patch and export files
        working-directory: apps/vendor_app
        run: |
          set -euo pipefail
          dart format lib/v21/catalog/catalog_search_sheet.dart lib/v21/catalog/supplier_catalog_editor.dart test/v21/supplier_catalog_editor_picker_test.dart
          for file in lib/v21/catalog/catalog_search_sheet.dart lib/v21/catalog/supplier_catalog_editor.dart test/v21/supplier_catalog_editor_picker_test.dart; do
            echo "SPLIZO_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "SPLIZO_FORMAT_END:$file"
          done
