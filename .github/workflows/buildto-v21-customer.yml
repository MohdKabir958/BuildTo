name: Splyzo customer V2.1
on:
  pull_request:
    paths:
      - 'apps/customer_app/**'
      - 'backend/v21/src/cart-service.ts'
      - 'backend/v21/src/catalog-read.ts'
      - 'backend/v21/src/catalog-routes.ts'
      - 'backend/v21/src/customer-refunds.ts'
      - 'backend/v21/src/customer-care-routes.ts'
      - 'backend/v21/test/customer-catalog.test.cjs'
      - '.github/workflows/buildto-v21-customer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: customer-v21-${{ github.ref }}
  cancel-in-progress: true
jobs:
  customer-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib/v21 test/v21
      - run: flutter analyze --no-pub lib/v21 test/v21
      - run: flutter test --no-pub --concurrency=2 test/v21
      - run: flutter build bundle --debug --no-pub --dart-define=BUILDTO_CUSTOMER_V21=true --dart-define=AUTH_MODE=clerk-test --dart-define=BUILDTO_V21_API_BASE_URL=https://buildto-v21-staging.onrender.com
  customer-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build:v21
      - run: node --test v21/test/customer-catalog.test.cjs
  customer-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build staging APK with the shared Clerk test instance
        env:
          GROZO_AUTH_MODE: clerk-test
          GRADLE_OPTS: '-Dorg.gradle.project.disableFirebase=true'
          CLERK_PUBLISHABLE_KEY: ${{ vars.SPLYZO_CUSTOMER_CLERK_PUBLISHABLE_KEY || vars.SPLYZO_SUPPLIER_CLERK_PUBLISHABLE_KEY || 'pk_test_aW5mb3JtZWQtZ3JpZmZvbi03Njc1LmNsZXJrLmFjY291bnRzLmRldiQ=' }}
        run: |
          set -euo pipefail
          [[ "$CLERK_PUBLISHABLE_KEY" == pk_test_* ]]
          flutter build apk --debug --no-pub --split-per-abi --target-platform android-arm64 \
            --dart-define=BUILDTO_CUSTOMER_V21=true --dart-define=AUTH_MODE=clerk-test \
            --dart-define=BUILDTO_V21_API_BASE_URL=https://buildto-v21-staging.onrender.com
          mkdir -p build/customer-staging
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk build/customer-staging/Splyzo-Customer-Staging-ARM64.apk
          cd build/customer-staging
          sha256sum Splyzo-Customer-Staging-ARM64.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Splyzo-Customer-Staging-ARM64
          path: apps/customer_app/build/customer-staging/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
