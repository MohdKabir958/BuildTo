name: BuildTo V2.1 Step 1 Money and Fulfillment Safety

on:
  push:
    branches:
      - buildto/v21-step1-money-fulfillment-safety-20261107
    paths:
      - '.github/workflows/buildto-v21-step1-money-safety.yml'
      - 'backend/v21/**'
      - 'backend/prisma/v21/**'
      - 'backend/package.json'
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/v21/**'
      - 'backend/prisma/v21/**'
      - '.github/workflows/buildto-v21-step1-money-safety.yml'

permissions:
  contents: read
jobs:
  step1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buildto_v21_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buildto_v21_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/buildto_v21_test
      PGPASSWORD: postgres
      NODE_ENV: test
      BUILDTO_V21_BASELINE_CONFIRM: ci-test
      BUILDTO_V21_ENV: local
      BUILDTO_V21_DELIVERY_OTP_HMAC_SECRET: ci-only-hmac-secret-0123456789abcdefghijklmnop
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Verify immutable baseline and Prisma schema
        run: |
          npm run db:v21:parity
          npm run db:v21:validate
      - name: Deploy disposable PostGIS and the additive Step 1 migration
        run: npm run db:v21:deploy-empty
      - name: Seed reference catalog
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../architecture/buildto-schema-v2.1/sql/reference-seed.sql
      - name: Compile V2.1 TypeScript
        run: npm run build:v21
      - name: Full transactional and API regression suite
        run: npm run test:v21:api
      - name: Legacy API still compiles independently
        run: |
          npx prisma generate
          npm run build
