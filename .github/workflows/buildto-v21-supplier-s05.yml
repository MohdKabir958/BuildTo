name: BuildTo Supplier S05 catalog and pricing
on:
  pull_request:
    paths:
      - 'apps/vendor_app/lib/v21/**'
      - 'apps/vendor_app/test/v21/**'
      - 'apps/vendor_app/docs/v21/S05-CATALOG.md'
      - '.github/workflows/buildto-v21-supplier-s05.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Resolve locked Flutter packages
        working-directory: apps/vendor_app
        run: flutter pub get --enforce-lockfile
      - name: Enforce checked-in Dart formatting
        working-directory: apps/vendor_app
        run: dart format --output=none --set-exit-if-changed lib/v21 test/v21
      - name: Strict supplier V2.1 analyzer
        working-directory: apps/vendor_app
        run: flutter analyze --no-pub lib/v21 test/v21
      - name: Complete S01–S05 feature regression suite
        working-directory: apps/vendor_app
        run: flutter test --no-pub --concurrency=2 test/v21
      - name: Build isolated S05 staging bundle
        working-directory: apps/vendor_app
        run: |
          flutter build bundle --debug --no-pub \
            --dart-define=BUILDTO_SUPPLIER_V21=true \
            --dart-define=AUTH_MODE=clerk-test \
            --dart-define=BUILDTO_V21_API_BASE_URL=https://buildto-v21-staging.onrender.com
