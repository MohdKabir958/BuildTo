name: Buildto V2.1 final integration and release security gates
on:
  push:
    branches: [backend/v21-16-release-security-integration]
  pull_request:
    paths:
      - 'backend/v21/**'
      - 'backend/prisma/v21/**'
      - 'backend/scripts/v21/**'
      - 'backend/package.json'
      - 'architecture/buildto-schema-v2.1/**'
      - '.github/workflows/buildto-v21-release-gates.yml'
permissions:
  contents: read
jobs:
  release-candidate-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buildto_v21_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d buildto_v21_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/buildto_v21_test
      PGPASSWORD: postgres
      NODE_ENV: test
      BUILDTO_V21_ENV: local
      BUILDTO_V21_BASELINE_CONFIRM: ci-test
      BUILDTO_V21_DELIVERY_OTP_HMAC_SECRET: ci-only-hmac-secret-0123456789abcdefghijklmnop
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Locked dependency install
        run: npm ci
      - name: Reviewed canonical V2.1 schema and migration parity
        run: |
          npm run db:v21:parity
          npm run db:v21:validate
      - name: Deploy 3 migrations to disposable PostGIS database only
        run: npm run db:v21:deploy-empty
      - name: Seed reference units and catalog without live credentials
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../architecture/buildto-schema-v2.1/sql/reference-seed.sql
      - name: Compile strict V2.1 TypeScript
        run: npm run build:v21
      - name: Full database-backed API, identity and finance regression
        run: npm run test:v21:api
      - name: Read-only release preflight after every integration test
        run: npm run release:v21:preflight
      - name: Compile preserved legacy backend independently
        run: |
          npx prisma generate
          npm run build
