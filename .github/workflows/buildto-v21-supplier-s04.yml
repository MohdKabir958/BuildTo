name: BuildTo Supplier S04 live dashboard
on:
  pull_request:
    paths:
      - 'apps/vendor_app/lib/v21/**'
      - 'apps/vendor_app/test/v21/**'
      - 'apps/vendor_app/docs/v21/S04-DASHBOARD.md'
      - '.github/workflows/buildto-v21-supplier-s04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplier-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Resolve locked Flutter packages
        working-directory: apps/vendor_app
        run: flutter pub get --enforce-lockfile
      - name: Format S04 source for initial review
        working-directory: apps/vendor_app
        run: dart format lib/v21 test/v21
      - name: Capture reviewed formatting
        working-directory: apps/vendor_app
        run: |
          python3 - <<'PY'
          import json,pathlib
          for root in ('lib/v21','test/v21'):
              for path in sorted(pathlib.Path(root).rglob('*.dart')):
                  print('S04_FORMATTED_FILE '+str(path)+' '+json.dumps(path.read_text(),ensure_ascii=True))
          PY
      - name: Analyze supplier V2.1 code and tests
        working-directory: apps/vendor_app
        run: flutter analyze --no-pub lib/v21 test/v21
      - name: Run all S01–S04 supplier Flutter tests
        working-directory: apps/vendor_app
        run: flutter test --no-pub --concurrency=2 test/v21
      - name: Build isolated S04 supplier staging bundle
        working-directory: apps/vendor_app
        run: |
          flutter build bundle --debug --no-pub \
            --dart-define=BUILDTO_SUPPLIER_V21=true \
            --dart-define=AUTH_MODE=clerk-test \
            --dart-define=BUILDTO_V21_API_BASE_URL=https://buildto-v21-staging.onrender.com
