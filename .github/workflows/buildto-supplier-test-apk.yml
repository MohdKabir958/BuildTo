name: Splyzo Supplier Staging Android APK
on:
  push:
    branches:
      - buildto/supplier-apk-test-20261106
      - fix/v21-backend-audit-all-phases
      - main
      - branding/splyzo-rebrand-20261111
    paths:
      - '.github/workflows/buildto-supplier-test-apk.yml'
      - 'apps/vendor_app/**'
      - 'packages/**'
      - 'branding/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-supplier-test-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: 'true'
      GROZO_AUTH_MODE: clerk-test
      GRADLE_OPTS: '-Dorg.gradle.project.disableFirebase=true'
      # Publishable key is public by design. Override in repo Variables for future rebuilds.
      STAGING_CLERK_PUBLISHABLE_KEY: ${{ vars.SPLYZO_SUPPLIER_CLERK_PUBLISHABLE_KEY || vars.BUILDTO_SUPPLIER_CLERK_PUBLISHABLE_KEY || 'pk_test_aW5mb3JtZWQtZ3JpZmZvbi03Njc1LmNsZXJrLmFjY291bnRzLmRldiQ=' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Resolve supplier Flutter packages from lockfile
        working-directory: apps/vendor_app
        run: flutter pub get --enforce-lockfile
      - name: Format, analyze and test supplier V2.1
        working-directory: apps/vendor_app
        run: |
          set -euo pipefail
          dart format lib/v21 test/v21
          # Export the canonical formatter output so formatting-only changes can be committed
          # back to the feature branch instead of being silently modified only in CI.
          for file in \
            lib/v21/auth/supplier_auth_gate.dart \
            lib/v21/delivery/supplier_delivery_view.dart \
            lib/v21/inventory/supplier_inventory_view.dart \
            lib/v21/shipments/supplier_shipments_repository.dart \
            lib/v21/shipments/supplier_shipments_view.dart; do
            echo "SPLIZO_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "SPLIZO_FORMAT_END:$file"
          done
          flutter analyze --no-pub --no-fatal-infos lib/v21 test/v21
          flutter test --no-pub --concurrency=2 test/v21
      - name: Generate Splyzo launcher artwork
        run: |
          set -euo pipefail
          cd apps/vendor_app
          dart run flutter_launcher_icons
      - name: Compile supplier V2.1 staging APK with native Clerk bridge
        working-directory: apps/vendor_app
        run: |
          set -euo pipefail
          sed -i 's#^vendor.applicationId=.*#vendor.applicationId=in.buildto.supplier.staging#' ../../branding/android.properties
          sed -i 's#^vendor.label=.*#vendor.label=Splyzo Supplier Staging#' ../../branding/android.properties
          sed -i 's#Splyzo Supplier#Splyzo Supplier Staging#' android/app/src/main/res/values/branding.xml
          if [[ "$STAGING_CLERK_PUBLISHABLE_KEY" != pk_test_* ]]; then
            echo 'A valid Clerk TEST publishable key must be set.'
            exit 1
          fi
          export CLERK_PUBLISHABLE_KEY="$STAGING_CLERK_PUBLISHABLE_KEY"
          mkdir -p ../../build/splyzo-supplier-test
          echo 'REAL_STAGING_CLERK_TEST_KEY_CONFIGURED=yes' > ../../build/splyzo-supplier-test/STAGING-CONFIG.txt
          echo 'Splyzo Clerk native test key supplied. Android sign-in requires this Clerk instance to be active.' >> ../../build/splyzo-supplier-test/STAGING-CONFIG.txt
          echo 'Staging API: https://buildto-v21-staging.onrender.com (reachability not guaranteed by compile).' >> ../../build/splyzo-supplier-test/STAGING-CONFIG.txt
          flutter build apk --debug --no-pub --split-per-abi --target-platform android-arm64 \
            --dart-define=BUILDTO_SUPPLIER_V21=true \
            --dart-define=AUTH_MODE=clerk-test \
            --dart-define=BUILDTO_V21_API_BASE_URL=https://buildto-v21-staging.onrender.com
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
            ../../build/splyzo-supplier-test/Splyzo-Supplier-Staging-ARM64.apk
      - name: SHA256 checksum, provenance and installation instructions
        run: |
          set -euo pipefail
          cd build/splyzo-supplier-test
          sha256sum *.apk > SHA256SUMS.txt
          cat > README-INSTALL.txt <<EOF
          Splyzo Supplier Android V2.1 - ARM64 test APK (NOT Play Store releases)
          Source branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Flutter: 3.44.9, Android debug signatures, ARM64 only.
          
          Splyzo-Supplier-Staging-ARM64.apk
             Android package: in.buildto.supplier.staging
             Welcome-first supplier flow, full V2.1 screens, native Clerk SDK.
             Supports separate Sign in, Create account, and recovery actions.
             Real device E2E testing still required.
             Full Flutter V2.1 screens, native Clerk SDK, real user-provided
             Clerk publishable TEST key (informed-griffon-7675).
             Live sign-in depends on an active configured Clerk test instance,
             Android OAuth redirect/settings (if needed) and test users.
             Viewing protected supplier data additionally requires a deployed
             and reachable Splyzo V2.1 staging API configured to verify the
             SAME Clerk instance, plus server-approved supplier membership.
             These external dependencies are not proven by an APK compile.
             NO real banking payments or production order transactions.
          
          Download the artifact ZIP from this GitHub Actions run, unzip, and
          tap the selected APK on a 64-bit Android phone. Grant install-from-
          this-source permission when Android prompts. Debug-signed for QA.
          Check SHA256SUMS.txt if transferring or distributing the APK.
          
          These APKs do not require Google Play registration. Do not share
          staging account secrets, OTPs, supplier banking or private data.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Splyzo-Supplier-Clerk-Staging-ARM64
          path: build/splyzo-supplier-test/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
