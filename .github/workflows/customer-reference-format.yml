name: Customer reference Dart format capture temporary
on:
  push:
    branches: [feat/customer-reference-ui-navy-orange-20261123]
    paths: ['.github/workflows/customer-reference-format.yml']
permissions:
  contents: read
jobs:
  format-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Format and export approved customer UI Dart files
        working-directory: apps/customer_app
        run: |
          set -euo pipefail
          dart format lib/v21/customer_reference_home.dart lib/v21/customer_reference_auth.dart lib/v21/customer_app.dart lib/v21/customer_design.dart lib/v21/customer_workspace.dart test/v21/customer_reference_ui_test.dart
          for file in lib/v21/customer_reference_home.dart lib/v21/customer_reference_auth.dart lib/v21/customer_app.dart lib/v21/customer_design.dart lib/v21/customer_workspace.dart test/v21/customer_reference_ui_test.dart; do
            echo "SPLYZO_REF_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "SPLYZO_REF_FORMAT_END:$file"
          done
