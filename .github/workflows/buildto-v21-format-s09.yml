name: S09 one-time Dart formatter
on:
  push:
    branches:
      - supplier/v21-s09-order-acceptance
    paths:
      - '.github/workflows/buildto-v21-format-s09.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - name: Resolve pinned dependencies
        working-directory: apps/vendor_app
        run: flutter pub get --enforce-lockfile
      - name: Format supplier V2.1
        working-directory: apps/vendor_app
        run: dart format lib/v21 test/v21
      - name: Commit generated formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/vendor_app/lib/v21 apps/vendor_app/test/v21
          if ! git diff --cached --quiet; then
            git commit -m "style(s09): apply official Dart formatter"
            git push origin HEAD:supplier/v21-s09-order-acceptance
          fi
