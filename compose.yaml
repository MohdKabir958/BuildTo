# Disposable local V2.1 PostgreSQL/PostGIS for integration tests only.
# Do NOT connect this container to Neon staging or production.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buildto_v21_test
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - buildto_v21_test_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildto_v21_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  buildto_v21_test_pg:
